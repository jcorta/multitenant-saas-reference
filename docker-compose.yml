# Ports are published on 127.0.0.1 only: the default credentials are for local development.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurants}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-owner_dev_password}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:-runtime_dev_password}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-restaurants}']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: creates the development JWT key pair in ./.keys if it does not exist yet.
  keys:
    image: node:22-slim
    working_dir: /app
    command: node scripts/generate-keys.mjs
    volumes:
      - ./scripts:/app/scripts:ro
      - ./.keys:/app/.keys

  # One-shot: applies migrations (as the schema owner) and seeds development data once.
  migrate:
    init: true
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "node apps/api/dist/scripts/migrate.js && node apps/api/dist/scripts/seed.js"
    environment: &db-env
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-restaurants}
      DB_OWNER_USER: app_owner
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-owner_dev_password}
      DB_RUNTIME_USER: app_runtime
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:-runtime_dev_password}
      SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMe123!}
    depends_on:
      db:
        condition: service_healthy

  api:
    # Runs a minimal init as PID 1 so signals reach Node and stops are not forced.
    init: true
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *db-env
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_PRIVATE_KEY_PATH: .keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: .keys/jwt-public.pem
    volumes:
      - ./.keys:/app/.keys:ro
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      keys:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    init: true
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Resolved by the browser, so it points at the published API port on the host.
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:4000/api}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
